 p.preview=p.next;p.replied=true;clueCount++;
 save();render();$('storyStatus').textContent='已发现 '+clueCount+' 条故事线索';
 toast('发现新线索！🔎');
}

 toast(p.name+' 发来了一条新消息');
}

function toggleXAccountSwitcher(open){const el=$('xAccountSwitcher');if(!el)return;el.classList.toggle('open',open===undefined?!el.classList.contains('open'):open)}
function switchXAccount(account){xAccount=account;renderX($('appContent'));toast(account==='main'?'已切换到 Lin Yun-Ju':'已切换到 omo_1727');}
function switchXTab(btn,tab){document.querySelectorAll('.xtab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(tab==='posts')return;const timeline=$('xTimeline');if(timeline)timeline.innerHTML=`<div class="xempty">${tab==='media'?'暂无更多媒体内容':tab==='replies'?'还没有回复':'喜欢的内容暂未显示'}<br><span style="font-size:11px">这是本地模拟页面</span></div>`}
function toggleXLike(btn){btn.classList.toggle('liked');btn.textContent=btn.classList.contains('liked')?'♥ 已喜欢':'♡ 喜欢'}
function publishXPost(){const input=$('xNewPost');if(!input||!input.value.trim()){toast('先写点内容吧');return}mainAccountPosts.unshift({date:'刚刚',text:input.value.trim(),photo:''});renderX($('appContent'));toast('已发布模拟动态')}

function tweet(n,e,t){return `<div class="post" style="padding:12px;display:flex;gap:9px"><div class="avatar">${e}</div><div style="flex:1;font-size:12px;line-height:1.7"><b>${esc(n)}</b><div>${esc(t)}</div><button class="action" onclick="toast('评论功能（模拟）')">评论</button><button class="action" onclick="this.textContent=this.textContent.includes('♡')?'♥ 已喜欢':'♡ 喜欢'">♡ 喜欢</button></div></div>`}
function publishTweet(){
 const input=$('tweetInput'),v=input.value.trim();if(!v){toast('先写点内容吧');return}
 $('tweets').insertAdjacentHTML('afterbegin',tweet(owner,avatar,v));input.value='';toast('已发布模拟动态');
}
function renderSettings(c){
 c.innerHTML=`<div class="setting"><div class="settingrow"><label>手机主人名字</label><input id="ownerInput" value="${esc(owner)}" maxlength="16"></div><div class="settingrow"><label>手机主人头像（输入一个 emoji）</label><input id="avatarInput" value="${esc(avatar)}" maxlength="8"></div>
 <div class="settingrow"><label>手机壁纸</label><select id="wallInput"><option value="mint">薄荷奶油</option><option value="pink">樱花粉</option><option value="blue">晴空蓝</option><option value="night">静谧夜色</option></select></div>
 <button class="primary" style="margin:12px 0" onclick="saveSettings()">保存个性化设置</button></div>
 <div class="setting"><div style="padding:13px 0;font-weight:700;font-size:13px">LINE 联系人改名</div>
 ${contacts.map((p,i)=>`<div class="settingrow"><label>${esc(p.name)}</label><input id="contact${i}" value="${esc(p.name)}" maxlength="20"></div>`).join('')}
 <button class="primary" style="margin:12px 0" onclick="saveNames()">保存联系人名字</button></div>
 <div class="setting"><div class="settingrow"><b>剧情进度</b><p class="muted">已发现 ${clueCount} 条线索。选择不同的回复，会影响你发现故事的过程。</p><button class="smallbtn" onclick="resetStory()">重新开始剧情</button></div></div>
 <div class="muted">演示版本：设置保存在当前浏览器中。</div>`;
 $('wallInput').value=wall;
}
function saveSettings(){
 owner=$('ownerInput').value.trim()||'小屿';avatar=$('avatarInput').value.trim()||'🌷';wall=$('wallInput').value;
 save();applyWall();$('welcome').textContent='Good day, '+owner+' '+avatar;toast('设置已保存');render();
}
function saveNames(){
 contacts.forEach((p,i)=>{const v=$('contact'+i).value.trim();if(v)p.name=v});
 save();toast('联系人名字已更新');render();
}
function resetStory(){
 if(!confirm('确定要重置剧情进度吗？聊天记录和线索都会恢复初始状态。'))return;
 contacts=defaultContacts.map(p=>({...p,messages:p.messages.map(m=>({...m})),replied:false}));
 clueCount=0;save();toast('剧情已重新开始');render();
}
function renderNotes(c){
 c.innerHTML=`<div class="post" style="padding:15px"><h3 style="font-size:15px">☁️ 给自己的小纸条</h3><textarea id="note" class="compose" style="min-height:230px" placeholder="写下你的想法……"></textarea><button class="primary" style="margin-top:12px" onclick="localStorage.setItem('myPhoneNote',$('note').value);toast('备忘录已保存')">保存</button></div>`;
 $('note').value=localStorage.getItem('myPhoneNote')||'六月二十七日。\\n还有一些事情没有答案……';
}
function renderPhotos(c){
 c.innerHTML=`<h3 style="font-size:15px">最近项目</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">${['🌷','🌊','☁️','🌿','🌅','🐈','☕','🌸','🌙','🍓','🪴','✨'].map((e,i)=>`<div style="aspect-ratio:1;display:grid;place-items:center;border-radius:9px;font-size:28px;background:${['#f4e0db','#dce9ee','#e9e6f1','#dbe9dc'][i%4]}">${e}</div>`).join('')}</div><p class="muted">演示相册 · 暂无真实照片</p>`;
}
</script>
</body></html>
